<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Moja pierwsza strona</title>
</head>
<body style="text-align:center;font-family:Arial;margin-top:100px;">

<h1>Siema! 👋</h1>

<p>Jestem Karol. To moja pierwsza strona internetowa (nie z ESP32 i localhosta 😎).</p>

<h2>Wejścia:</h2>
<p id="licznik">Ładowanie...</p>

<script>
fetch("https://api.countapi.xyz/hit/jajkojjd/randomowa_strona")
.then(res => res.json())
.then(data => {
    document.getElementById("licznik").innerText = data.value;
});
</script>

</body>
</html>
